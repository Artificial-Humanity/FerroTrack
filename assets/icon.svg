<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- FerroTrack: an issue track — hollow stations are open issues,
       the filled terminal is the resolved one. Sibling system to
       FerroStep's icon: same slate ground, same ferrous gradient.
       assets/icon.png is the shipped raster (Lucida render). -->
  <defs>
    <linearGradient id="fe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F26B21"/>
      <stop offset="1" stop-color="#B23A0E"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="#14181F"/>
  <path d="M128 52 V204" fill="none" stroke="url(#fe)"
        stroke-width="26" stroke-linecap="butt"/>
  <circle cx="128" cy="52" r="15" fill="#14181F" stroke="#F26B21" stroke-width="10"/>
  <circle cx="128" cy="126" r="15" fill="#14181F" stroke="#D2500F" stroke-width="10"/>
  <circle cx="128" cy="204" r="17" fill="#F58A3C"/>
</svg>
