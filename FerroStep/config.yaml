# config.yaml — the single place this repo's configurable working values live.
#
# The rule is the sibling FerroStep's, inherited deliberately (owner, 2026-08-20 there):
# a configurable value is SET here and prose POINTS here — a document that writes a value
# out is a second copy waiting to drift. That covers the agent TITLES too.
#
# `ferrostep agent-env` (or `cargo xtask agent-env` inside FerroStep) is the reader that
# turns an entry into shell variables; `--agent <title>` selects a non-default entry.

# The entry an unmarked session adopts. CLAUDE.md imports its persona.
default_agent: developer

# Every agent that works this repo, keyed by title. Identity is a CONVENTION, not a
# mechanism — git will happily commit as whoever the repo is configured for, so each agent
# carries the `-c` pair; the procedure and the after-commit check live in the developer
# persona's §1. The identities below were set by the owner, 2026-08-28.
agents:
  developer:
    name: PJ
    email: PJ@artificialhumanity.io
    persona: personas/DEVELOPER.md
  reviewer:
    name: Janis
    email: janis@artificialhumanity.io
    persona: personas/REVIEWER.md
    # How the reviewer is LAUNCHED. History, because the value has moved three times and
    # the reasons do not all point the same way:
    #   2026-09-02  Fable 5.1 at high      (owner)
    #   2026-09-03  lowered to medium      (owner: token usage at high measured too costly)
    #   2026-09-07  Opus 5 at xhigh        (owner) — reverted the same day
    #   2026-09-07  back to Fable 5.1 at medium (owner)
    # The 2026-09-07 excursion is kept because the git history shows it: the setting was
    # raised past the level withdrawn on cost grounds on 2026-09-03, then returned within
    # the day. The cost finding above stands unchanged.
    # These are the same keys Sonora's roster carries, so a launcher pointed at this repo
    # finds them in the one place. ⚠ DECLARATION, NOT YET AN INSTANCE: nothing in this
    # repo reads them today. `ferrostep agent-env` tolerates unknown keys and ignores
    # them, and no review lane is adopted here (AGENTS.md §4). They become behaviour when
    # a launcher that reads the roster (Sonora's `workflow/scripts/roster_launch.py`, or
    # `agent-env` itself once it emits AGENT_MODEL / AGENT_EFFORT) runs against this file
    # — check that before reading them as configured behaviour. The developer entry
    # deliberately has none: that agent's model is set at runtime by the owner.
    model: claude-fable-5-1
    effort: medium      # the claude CLI's ladder: low | medium | high | xhigh | max
    # budget_usd is DELIBERATELY UNSET (owner, 2026-09-07). Absent means NO ceiling, and
    # the roster invents no default, so this is a chosen state rather than a gap.
    # ⚠ Set at 2.0 briefly the same day and withdrawn: on a subscription plan the figure
    # is a TOKEN proxy, not an API bill — at the measured rate ~$5 ≈ 88k tokens, so $2 was
    # ~35k tokens, which is one small review rather than a generous ceiling. A run that
    # stops at its cap yields a partial review that reads like a finished one.
    # ⚠ Waiting on MEASUREMENT of what a review actually costs, not on a preference.
